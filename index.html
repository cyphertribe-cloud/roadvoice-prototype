
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoadVoice</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101722;color:white;font-family:Arial,sans-serif;padding:20px}
h1{color:#53d9ff;margin-bottom:4px}
p{color:#b5c4d4}
.card{background:#1c2939;padding:20px;border-radius:16px;margin:18px 0}
button,select{width:100%;padding:15px;margin:8px 0;border:0;border-radius:10px;font-size:16px}
button{background:#36c7ef;color:#07131c;font-weight:bold}
select{background:#34465a;color:white}
#map{height:220px;background:#263748;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center}
.small{font-size:13px}
</style>
</head>
<body>
<h1>🚗 RoadVoice</h1>
<p>Your road. Your voice.</p>

<div class="card">
<h2>📍 GPS Location</h2>
<div id="map">GPS location preview</div>
<p id="location">Location not requested.</p>
<button onclick="findMe()">Find My Location</button>
</div>

<div class="card">
<h2>🔊 Voice Studio</h2>
<label for="personality">Navigation Personality</label>
<select id="personality">
<option value="standard">Standard</option>
<option value="sarcastic">Sarcastic</option>
<option value="dramatic">Dramatic</option>
<option value="robot">Robot</option>
</select>
<button onclick="speakDirection()">Preview Direction</button>
</div>

<div class="card">
<h2>🎙️ Record Your Voice</h2>
<button onclick="startRecording()">Start Recording</button>
<button onclick="stopRecording()">Stop Recording</button>
<button onclick="playRecording()">Play Recording</button>
<p id="recordStatus" class="small">Ready to record.</p>
</div>

<p class="small">RoadVoice Prototype 1.0</p>

<script>
function findMe(){
const output=document.getElementById("location");
if(!navigator.geolocation){
output.textContent="GPS not supported.";
return;
}
output.textContent="Finding location...";
navigator.geolocation.getCurrentPosition(
p=>{
const lat=p.coords.latitude;
const lon=p.coords.longitude;
output.textContent="GPS location acquired.";
document.getElementById("map").innerHTML=
'<a style="color:#53d9ff" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat='+lat+'&mlon='+lon+'#map=15/'+lat+'/'+lon+'">View my location on map</a>';
},
()=>output.textContent="Location unavailable. Check permissions.",
{enableHighAccuracy:true,timeout:15000}
);
}

function speakDirection(){
const type=document.getElementById("personality").value;
const phrases={
standard:"In 500 feet, turn right.",
sarcastic:"Turn right in 500 feet. Try not to miss it this time.",
dramatic:"In 500 feet, turn right. Your destiny awaits!",
robot:"Navigation command. Turn right in 500 feet."
};
speechSynthesis.cancel();
const voice=new SpeechSynthesisUtterance(phrases[type]);
voice.rate=type==="robot"?0.8:1;
voice.pitch=type==="dramatic"?1.3:1;
speechSynthesis.speak(voice);
}

let recorder;
let chunks=[];
let recordingUrl;
let stream;

async function startRecording(){
try{
stream=await navigator.mediaDevices.getUserMedia({audio:true});
chunks=[];
recorder=new MediaRecorder(stream);
recorder.ondataavailable=e=>{
if(e.data.size)chunks.push(e.data);
};
recorder.onstop=()=>{
if(recordingUrl)URL.revokeObjectURL(recordingUrl);
recordingUrl=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));
stream.getTracks().forEach(t=>t.stop());
document.getElementById("recordStatus").textContent="Recording ready!";
};
recorder.start();
document.getElementById("recordStatus").textContent="Recording...";
}catch(e){
document.getElementById("recordStatus").textContent="Microphone permission needed.";
}
}

function stopRecording(){
if(recorder&&recorder.state==="recording")recorder.stop();
}

function playRecording(){
if(recordingUrl)new Audio(recordingUrl).play();
else alert("Record a phrase first.");
}
</script>
</body>
</html>
